<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2D5A4C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.json" />
  <title>Carnet de Voyage • Riga & Stockholm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    :root {
      --bg-paper: #FAF5EE;
      --bg-card: #FFFFFF;
      --bg-warm: #F3EAE0;
      --bg-accent-light: #FCEEE9;
      --bg-sage-light: #EBF2EE;
      --bg-gold-light: #FDF6E4;
      --text-main: #2C221E;
      --text-muted: #6E5D54;
      --accent-terra: #C85A32;
      --accent-terra-dark: #A3421F;
      --accent-forest: #2D5A4C;
      --accent-gold: #D49B35;
      --border-soft: #E6DBD0;
      --shadow-card: 0 8px 24px rgba(44, 34, 30, 0.06);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --smooth: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-paper);
      color: var(--text-main);
      line-height: 1.55;
      padding-bottom: 148px;
      max-width: 540px;
      margin: 0 auto;
      min-height: 100vh;
      box-shadow: 0 0 40px rgba(0,0,0,0.05);
      overflow-x: hidden;
    }

    h1, h2, h3, .serif { font-family: 'Fraunces', Georgia, serif; font-weight: 700; }

    /* HEADER CARNET DE VOYAGE ANIMÉ */
    .hero-header {
      background: linear-gradient(155deg, #2D5A4C 0%, #1B3B32 100%);
      color: #FAF5EE;
      padding: 22px 18px 18px;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(27, 59, 50, 0.16);
    }

    .hero-header::before, .hero-header::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 185, 97, 0.25) 0%, rgba(244, 185, 97, 0) 70%);
      pointer-events: none;
      animation: floatOrb 7s ease-in-out infinite alternate;
    }
    .hero-header::before { width: 220px; height: 220px; top: -80px; right: -40px; }
    .hero-header::after { width: 180px; height: 180px; bottom: -70px; left: -40px; animation-delay: -3.5s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-15px, 12px) scale(1.12); }
    }

    .hero-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 4px 11px;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .pedometer-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(244, 185, 97, 0.24);
      border: 1px solid rgba(244, 185, 97, 0.55);
      color: #FFF;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    .hero-header h1 { font-size: 1.55rem; line-height: 1.2; margin-bottom: 4px; }
    .hero-subtitle { font-size: 0.83rem; opacity: 0.9; margin-bottom: 10px; }

    .progress-bar-wrap {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 99px;
      height: 9px;
      width: 100%;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #F4B961, #FFE09E, #F4B961);
      background-size: 200% 100%;
      height: 100%;
      width: 0%;
      border-radius: 99px;
      transition: width 0.6s var(--spring);
      animation: shimmer 2.8s infinite linear;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.73rem;
      opacity: 0.94;
      margin-top: 6px;
      font-weight: 500;
    }

    /* BANDEAU "AUJOURD'HUI & PROCHAINE ÉTAPE" */
    .today-banner {
      background: linear-gradient(135deg, #FCEEE9 0%, #FDF6E4 100%);
      border: 1.5px solid #F0D5C8;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(200, 90, 50, 0.08);
    }

    /* BARRE MÉTÉO & COUCHER DE SOLEIL */
    .weather-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--bg-sage-light);
      border: 1px solid #CFE0D7;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 0.78rem;
      color: var(--accent-forest);
      font-weight: 600;
      margin-bottom: 12px;
    }

    /* =======================================================
       BARRE D'ONGLETS EN BAS — EFFET LIQUID GLASS SURÉLEVÉ
       ======================================================= */
    .liquid-glass-dock {
      position: fixed;
      bottom: calc(34px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 20px);
      max-width: 510px;
      z-index: 9500;
      padding: 6px;
      border-radius: 30px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.62) 0%,
        rgba(255, 248, 240, 0.38) 50%,
        rgba(255, 255, 255, 0.56) 100%
      );
      backdrop-filter: blur(26px) saturate(200%);
      -webkit-backdrop-filter: blur(26px) saturate(200%);
      border: 1.2px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        0 16px 38px rgba(44, 34, 30, 0.18),
        0 3px 10px rgba(44, 34, 30, 0.07),
        inset 0 2px 2px rgba(255, 255, 255, 0.96),
        inset 0 -1.5px 3px rgba(200, 90, 50, 0.1);
    }

    .nav-pills-wrap {
      position: relative;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      align-items: center;
    }

    .liquid-glider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: calc(100% / 6);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.95) 0%, rgba(252, 238, 233, 0.82) 100%);
      box-shadow: 0 5px 15px rgba(200, 90, 50, 0.2), inset 0 2px 1.5px rgba(255, 255, 255, 1);
      border: 1px solid rgba(255, 255, 255, 0.92);
      transition: transform 0.48s var(--spring);
      pointer-events: none;
      z-index: 0;
    }

    .nav-btn {
      position: relative;
      z-index: 1;
      background: transparent;
      border: none;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: #5C4D44;
      font-size: 0.61rem;
      font-weight: 700;
      cursor: pointer;
      padding: 7px 1px;
      font-family: inherit;
      transition: color 0.25s ease, transform 0.22s var(--spring);
    }

    .nav-btn .ico { font-size: 1.14rem; transition: transform 0.34s var(--spring); }
    .nav-btn.active { color: var(--accent-terra-dark); }
    .nav-btn.active .ico { transform: scale(1.24) translateY(-2px); }
    .nav-btn:active { transform: scale(0.88); }

    /* CONTENEURS D'ONGLETS */
    .tab-section { display: none; padding: 16px 15px 24px; }
    .tab-section.active { display: block; animation: tabAppear 0.38s var(--smooth) both; }

    @keyframes tabAppear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* FILTRES DE JOURS */
    .day-selector {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 2px 12px;
      scrollbar-width: none;
    }
    .day-selector::-webkit-scrollbar { display: none; }

    .day-pill {
      flex: 0 0 auto;
      background: var(--bg-card);
      border: 1.5px solid var(--border-soft);
      color: var(--text-muted);
      padding: 7px 13px;
      border-radius: 14px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s var(--spring);
      text-align: center;
    }
    .day-pill span.sub { display: block; font-size: 0.65rem; font-weight: 500; opacity: 0.8; }
    .day-pill.active {
      background: var(--accent-terra);
      border-color: var(--accent-terra);
      color: #FFF;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(200, 90, 50, 0.28);
    }

    /* CARTES DE JOURNÉE */
    .day-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-card);
    }

    .day-card-header {
      border-bottom: 1px dashed var(--border-soft);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .day-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 6px;
      margin-bottom: 5px;
    }
    .tag-riga { background: var(--bg-accent-light); color: var(--accent-terra-dark); }
    .tag-stockholm { background: var(--bg-sage-light); color: var(--accent-forest); }
    .tag-chill { background: var(--bg-gold-light); color: #9A6B15; }

    .day-title { font-size: 1.14rem; color: var(--text-main); }

    .day-tip-box {
      background: var(--bg-gold-light);
      border-left: 3.5px solid var(--accent-gold);
      padding: 9px 11px;
      border-radius: var(--
